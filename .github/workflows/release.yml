name: Release to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import configparser
          import os

          config = configparser.ConfigParser()
          if not config.read("setup.cfg"):
              raise SystemExit("Could not read setup.cfg")

          package_version = config["metadata"]["version"].strip()
          expected_tag = f"v{package_version}"
          release_tag = os.environ["RELEASE_TAG"]

          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version "
                  f"{package_version!r}; expected {expected_tag!r}."
              )

          print(f"Validated release tag {release_tag} for package version {package_version}.")

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-rad
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
